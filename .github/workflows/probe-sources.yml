name: Probe Data Sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Chinese lottery endpoints
        run: |
          for url in \
            "https://kaijiang.500.com/static/info/kaijiang/xml/ssq/list.xml" \
            "https://kaijiang.500.com/static/info/kaijiang/xml/dlt/list.xml" \
            "https://kaijiang.500.com/static/info/kaijiang/xml/kl8/list.xml" \
            "https://datachart.500.com/dlt/history/newinc/history.php?start=26120&end=26130" \
            "https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=5&pageNo=1&pageSize=5&systemType=PC" \
            "https://api.allorigins.win/raw?url=https%3A%2F%2Fwww.cwl.gov.cn%2Fcwl_admin%2Ffront%2Fcwlkj%2Fsearch%2Fkjxx%2FfindDrawNotice%3Fname%3Dssq%26issueCount%3D5%26pageNo%3D1%26pageSize%3D5%26systemType%3DPC" ; do
            echo "===== $url"
            code=$(curl -L -s -o /tmp/out.txt -w "%{http_code}" --max-time 40 -A "Mozilla/5.0 Chrome/138" "$url" || true)
            echo "HTTP $code size=$(wc -c < /tmp/out.txt)"
            head -c 160 /tmp/out.txt | tr '\n' ' '
            echo ""
          done
